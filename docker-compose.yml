version: "3.9"

services:
  web:
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_OCR_URL: "http://localhost:8080/ocr"
    ports:
      - "3000:3000"
    depends_on:
      - ocr

  ocr:
    build:
      context: ./ocr
    environment:
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8080:8080"
