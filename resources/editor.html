<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>化学结构编辑器</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/kekule@0.9.9/dist/themes/default/kekule.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/kekule@0.9.9/dist/themes/default/styles/chemWidget.css"
    />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0f172a;
      }
      #editor-root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="editor-root"></div>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="https://unpkg.com/kekule@0.9.9/dist/kekule.js?modules=chemWidget,gui,calculation,openbabel,indigo"></script>
    <script>
      (function () {
        let composer = null;
        let bridge = null;

        function notifySmiles(smiles) {
          const value = smiles || "";
          if (bridge && typeof bridge.updateSmiles === "function") {
            try {
              bridge.updateSmiles(value);
            } catch (error) {
              console.error("updateSmiles call failed", error);
            }
          }
        }

        function refreshSmiles() {
          if (!composer) {
            notifySmiles("");
            return;
          }
          const chemObj = composer.getChemObj();
          if (!chemObj) {
            notifySmiles("");
            return;
          }
          try {
            const smiles = Kekule.IO.saveFormatData(chemObj, "smi") || "";
            notifySmiles(smiles);
          } catch (error) {
            console.error("Failed to convert to SMILES", error);
            notifySmiles("");
          }
        }

        function setupComposer() {
          const container = document.getElementById("editor-root");
          composer = new Kekule.Editor.Composer(container);
          composer.setEnableOperHistory(true);
          composer.setChemWidgetConfigs({
            enableHotkey: true,
            toolButtons: [
              "manipulate",
              "erase",
              "bond",
              "atom",
              "ring",
              "chain",
              "charge",
              "query",
              "text",
            ],
          });
          composer.addEventListener("chemObjChanged", refreshSmiles);
          composer.addEventListener("editOperationExec", refreshSmiles);
          refreshSmiles();
        }

        function connectBridge() {
          if (bridge) return;
          if (!window.qt || !window.qt.webChannelTransport) {
            setTimeout(connectBridge, 100);
            return;
          }
          new QWebChannel(window.qt.webChannelTransport, function (channel) {
            bridge = channel.objects.bridge;
            if (bridge && typeof bridge.pageReady === "function") {
              try {
                bridge.pageReady();
              } catch (error) {
                console.error("pageReady call failed", error);
              }
            }
          });
        }

        window.clearStructure = function () {
          if (!composer) return;
          composer.newEditorObj();
          refreshSmiles();
        };

        window.loadSmiles = function (smiles) {
          if (!composer) return false;
          try {
            const mol = Kekule.IO.loadFormatData(smiles || "", "smi");
            composer.setChemObj(mol);
            refreshSmiles();
            return true;
          } catch (error) {
            console.error("Failed to load SMILES", error);
            notifySmiles("");
            return false;
          }
        };

        window.refreshSmiles = refreshSmiles;

        document.addEventListener("DOMContentLoaded", function () {
          setupComposer();
          connectBridge();
        });
      })();
    </script>
  </body>
</html>
